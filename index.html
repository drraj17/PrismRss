<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#081526">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="PrismRSS">
    <title>PrismRSS — Colorful In-App Summary Reader</title>
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
    <link rel="icon" type="image/svg+xml" href="./icon.svg">
    <link rel="apple-touch-icon" sizes="512x512" href="./icon-512.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mozilla/readability@0.6.0/Readability.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anek+Tamil:wght@400;500;600;700&family=Arima:wght@500;600;700&family=Hind+Madurai:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Lora:ital,wght@0,400;0,600;1,400&family=Mukta+Malar:wght@400;500;600;700&family=Noto+Sans+Tamil:wght@400;500;600;700&family=Noto+Serif+Tamil:wght@400;600;700&family=Outfit:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&family=Spectral:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'Mukta Malar', 'Noto Sans Tamil', 'sans-serif'],
                        display: ['Plus Jakarta Sans', 'Mukta Malar', 'Anek Tamil', 'sans-serif'],
                        serif: ['Lora', 'Noto Serif Tamil', 'serif'],
                        lara: ['Spectral', 'Lora', 'Georgia', 'serif'],
                        outfit: ['Outfit', 'Hind Madurai', 'sans-serif'],
                        mono: ['JetBrains Mono', 'Noto Sans Tamil', 'monospace'],
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            --en-font: 'Inter', sans-serif;
            --en-heading-font: 'Plus Jakarta Sans', sans-serif;
            --ta-font: 'Mukta Malar', 'Noto Sans Tamil', sans-serif;
            --en-font-scale: 1;
            --ta-font-scale: 1;
            --line-height-scale: 1.65;
        }
        body {
            font-family: var(--en-font), var(--ta-font), sans-serif;
            font-size: calc(16px * var(--en-font-scale));
            transition: background-color 0.3s ease, color 0.3s ease;
            overflow-x: hidden;
        }
        h1, h2, h3, .font-display {
            font-family: var(--en-heading-font), var(--ta-font), sans-serif;
        }
        .ta-script {
            font-family: var(--ta-font), sans-serif !important;
            font-size: calc(1em * (var(--ta-font-scale) / var(--en-font-scale)));
            line-height: calc(var(--line-height-scale) + 0.12);
        }
        body.font-mode-serif {
            --en-font: 'Lora', serif;
            --en-heading-font: 'Lora', serif;
        }
        body.font-mode-lara {
            --en-font: 'Spectral', 'Lora', Georgia, serif;
            --en-heading-font: 'Spectral', 'Lora', Georgia, serif;
        }
        body.font-mode-outfit {
            --en-font: 'Outfit', sans-serif;
            --en-heading-font: 'Outfit', sans-serif;
        }
        body.font-mode-mono {
            --en-font: 'JetBrains Mono', monospace;
            --en-heading-font: 'JetBrains Mono', monospace;
        }
        body.ta-font-mukta { --ta-font: 'Mukta Malar', sans-serif; }
        body.ta-font-noto-sans { --ta-font: 'Noto Sans Tamil', sans-serif; }
        body.ta-font-noto-serif { --ta-font: 'Noto Serif Tamil', serif; }
        body.ta-font-anek { --ta-font: 'Anek Tamil', sans-serif; }
        body.ta-font-hind { --ta-font: 'Hind Madurai', sans-serif; }
        body.ta-font-arima { --ta-font: 'Arima', cursive; }

        .reader-body-text {
            font-size: calc(1.05rem * var(--en-font-scale));
            line-height: var(--line-height-scale);
        }

        /* Website-Like & Feeder Reader Formatting (Headings, Link Highlights, Text Highlights, Figures, Tables) */
        .summary-heading {
            font-family: var(--en-heading-font), var(--ta-font), sans-serif;
            font-weight: 800;
            font-size: calc(1.16rem * var(--en-font-scale));
            line-height: 1.35;
            margin-top: 1.15rem;
            margin-bottom: 0.35rem;
            padding-bottom: 0.35rem;
            border-bottom: 1px solid rgba(139, 92, 246, 0.22);
            color: #0f172a;
            display: flex;
            align-items: center;
            gap: 0.45rem;
        }
        .dark .summary-heading {
            color: #f8fafc;
            border-bottom-color: rgba(167, 139, 250, 0.24);
        }
        body.theme-sepia .summary-heading {
            color: #2b1d0e;
            border-bottom-color: rgba(180, 83, 9, 0.25);
        }
        .summary-heading::before {
            content: "";
            width: 4px;
            height: 1.05em;
            border-radius: 999px;
            background: linear-gradient(180deg, #c026d3, #7c3aed);
            flex-shrink: 0;
        }
        .summary-link {
            display: inline;
            padding: 0.06rem 0.38rem;
            border-radius: 0.38rem;
            background-color: rgba(14, 165, 233, 0.13);
            color: #0369a1;
            font-weight: 600;
            text-decoration: underline;
            text-decoration-color: rgba(14, 165, 233, 0.65);
            text-underline-offset: 2px;
            transition: background-color 0.15s ease, color 0.15s ease;
        }
        .summary-link:hover {
            background-color: rgba(14, 165, 233, 0.24);
        }
        .dark .summary-link {
            background-color: rgba(56, 189, 248, 0.16);
            color: #7dd3fc;
            text-decoration-color: rgba(125, 211, 252, 0.65);
        }
        .dark .summary-link:hover {
            background-color: rgba(56, 189, 248, 0.28);
        }
        body.theme-sepia .summary-link {
            background-color: rgba(180, 83, 9, 0.12);
            color: #9a3412;
            text-decoration-color: rgba(154, 52, 18, 0.6);
        }
        .summary-mark {
            padding: 0.06rem 0.36rem;
            border-radius: 0.35rem;
            background-color: rgba(250, 204, 21, 0.34);
            color: inherit;
            font-weight: 600;
        }
        .dark .summary-mark {
            background-color: rgba(250, 204, 21, 0.22);
            color: #fef08a;
        }
        body.theme-sepia .summary-mark {
            background-color: rgba(217, 119, 6, 0.22);
            color: #3f2e1d;
        }
        .summary-strong {
            font-weight: 700;
            padding: 0.04rem 0.28rem;
            border-radius: 0.3rem;
            background-color: rgba(139, 92, 246, 0.10);
            color: #1e1b4b;
        }
        .dark .summary-strong {
            background-color: rgba(167, 139, 250, 0.16);
            color: #ede9fe;
        }
        body.theme-sepia .summary-strong {
            background-color: rgba(146, 64, 14, 0.11);
            color: #2b1d0e;
        }
        .summary-quote {
            border-left: 3.5px solid #8b5cf6;
            background-color: rgba(139, 92, 246, 0.07);
            padding: 0.65rem 0.95rem;
            border-radius: 0 0.85rem 0.85rem 0;
            font-style: italic;
        }
        .dark .summary-quote {
            background-color: rgba(139, 92, 246, 0.13);
        }
        .summary-figure {
            margin: 0.85rem 0;
            border-radius: 1rem;
            overflow: hidden;
            border: 1px solid rgba(148, 163, 184, 0.28);
            background-color: rgba(15, 23, 42, 0.03);
        }
        .dark .summary-figure {
            background-color: rgba(255, 255, 255, 0.03);
        }
        .summary-figure img {
            width: 100%;
            max-height: 22rem;
            object-fit: cover;
            display: block;
        }
        .summary-figcaption {
            font-size: 0.78rem;
            line-height: 1.4;
            padding: 0.5rem 0.85rem;
            color: #64748b;
        }
        .dark .summary-figcaption {
            color: #94a3b8;
        }
        .summary-table-wrap {
            overflow-x: auto;
            border-radius: 0.85rem;
            border: 1px solid rgba(148, 163, 184, 0.3);
        }
        .summary-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }
        .summary-table th, .summary-table td {
            padding: 0.45rem 0.7rem;
            border-bottom: 1px solid rgba(148, 163, 184, 0.2);
            text-align: left;
        }
        .summary-table th {
            font-weight: 800;
            background-color: rgba(139, 92, 246, 0.08);
        }

        /* Vibrant Background Themes */
        .mesh-bg {
            background-color: #f8fafc;
            background-image:
                radial-gradient(at 0% 0%, rgba(236, 72, 153, 0.11) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(99, 102, 241, 0.12) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.09) 0px, transparent 50%),
                radial-gradient(at 0% 100%, rgba(245, 158, 11, 0.10) 0px, transparent 50%);
        }
        .dark .mesh-bg {
            background-color: #090d16;
            background-image:
                radial-gradient(at 0% 0%, rgba(236, 72, 153, 0.16) 0px, transparent 48%),
                rad
